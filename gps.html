<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPS 位置回報系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 自定義一些簡單的動畫效果 */
        @keyframes pulse-light {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        .loading-pulse {
            animation: pulse-light 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4 font-sans text-gray-800">

    <main class="bg-white rounded-2xl shadow-xl w-full max-w-md p-6 sm:p-8">
        <div class="text-center mb-6">
            <div class="inline-flex items-center justify-center w-12 h-12 bg-blue-100 text-blue-600 rounded-full mb-4">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 10.5a3 3 0 11-6 0 3 3 0 016 0z" />
                    <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1115 0z" />
                </svg>
            </div>
            <h1 class="text-2xl font-bold text-gray-900">位置回報</h1>
            <p class="text-sm text-gray-500 mt-1">請填寫資訊並傳送您當前的位置</p>
        </div>

        <form id="reportForm" class="space-y-4">
            <div>
                <label for="teamCode" class="block text-sm font-medium text-gray-700 mb-1">團隊編號 <span class="text-red-500">*</span></label>
                <input type="text" id="teamCode" required placeholder="請輸入團隊編號" 
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-shadow">
            </div>

            <div>
                <label for="name" class="block text-sm font-medium text-gray-700 mb-1">姓名 / 暱稱</label>
                <input type="text" id="name" placeholder="選填" 
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-shadow">
            </div>

            <div id="deviceInfo" class="text-xs text-gray-400 text-right font-mono truncate">
                <!-- UUID 將顯示於此 -->
            </div>

            <button type="submit" id="submitBtn" 
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-lg transition-colors flex justify-center items-center gap-2">
                <svg id="btnIcon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 12L3.269 3.126A59.768 59.768 0 0121.485 12 59.77 59.77 0 013.27 20.876L5.999 12zm0 0h7.5" />
                </svg>
                <span id="btnText">取得位置並送出</span>
            </button>
        </form>

        <div id="statusMessage" class="mt-4 hidden p-3 rounded-lg text-sm text-center">
            <!-- 狀態與訊息顯示區塊 -->
        </div>
    </main>

    <script>
        // 設定後端 API 網址 (請替換為您實際的 Google Apps Script Web App URL)
        const SCRIPT_URL = 'YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE';

        // DOM 元素
        const form = document.getElementById('reportForm');
        const teamCodeInput = document.getElementById('teamCode');
        const nameInput = document.getElementById('name');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const btnIcon = document.getElementById('btnIcon');
        const statusMessage = document.getElementById('statusMessage');
        const deviceInfo = document.getElementById('deviceInfo');

        // 1. 取得或產生 UUID (Device ID)
        function getDeviceUUID() {
            let uuid = localStorage.getItem('device_uuid');
            if (!uuid) {
                uuid = crypto.randomUUID();
                localStorage.setItem('device_uuid', uuid);
            }
            return uuid;
        }

        // 初始化顯示 UUID
        const deviceUUID = getDeviceUUID();
        deviceInfo.textContent = `Device: ${deviceUUID.substring(0, 8)}...`;

        // 2. 取得亞洲/台北時區當前時間 (YYYY/MM/DD HH:MM)
        function getTaipeiTime() {
            const now = new Date();
            const formatter = new Intl.DateTimeFormat('en-US', {
                timeZone: 'Asia/Taipei',
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                hour12: false // 使用 24 小時制
            });
            
            // 解析各部分來組成自定義格式
            const parts = formatter.formatToParts(now);
            const partObj = {};
            parts.forEach(p => partObj[p.type] = p.value);
            
            return `${partObj.year}/${partObj.month}/${partObj.day} ${partObj.hour}:${partObj.minute}`;
        }

        // 3. 取得地理位置 (Promise wrapper)
        function getGeolocation() {
            return new Promise((resolve, reject) => {
                if (!navigator.geolocation) {
                    reject(new Error("您的瀏覽器不支援地理位置功能。"));
                    return;
                }
                
                navigator.geolocation.getCurrentPosition(
                    (position) => resolve(position),
                    (error) => {
                        let errMsg = "無法取得位置。";
                        switch(error.code) {
                            case error.PERMISSION_DENIED: errMsg = "您拒絕了位置權限請求，請在瀏覽器設定中開啟。"; break;
                            case error.POSITION_UNAVAILABLE: errMsg = "位置資訊不可用。"; break;
                            case error.TIMEOUT: errMsg = "取得位置逾時。"; break;
                        }
                        reject(new Error(errMsg));
                    },
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                );
            });
        }

        // 輔助函式：更新 UI 狀態
        function setUIState(state, message = "") {
            statusMessage.classList.remove('hidden', 'bg-red-100', 'text-red-700', 'bg-green-100', 'text-green-700', 'bg-blue-100', 'text-blue-700');
            submitBtn.disabled = state === 'loading';
            
            if (state === 'loading') {
                submitBtn.classList.add('opacity-75', 'cursor-not-allowed', 'loading-pulse');
                btnText.textContent = message || "定位與傳送中...";
                btnIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99" />`; // Refresh icon
                statusMessage.classList.add('hidden');
            } else if (state === 'success') {
                submitBtn.classList.remove('opacity-75', 'cursor-not-allowed', 'loading-pulse');
                btnText.textContent = "取得位置並送出";
                btnIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" d="M6 12L3.269 3.126A59.768 59.768 0 0121.485 12 59.77 59.77 0 013.27 20.876L5.999 12zm0 0h7.5" />`; // Send icon
                
                statusMessage.textContent = message;
                statusMessage.classList.add('bg-green-100', 'text-green-700');
                statusMessage.classList.remove('hidden');
            } else if (state === 'error') {
                submitBtn.classList.remove('opacity-75', 'cursor-not-allowed', 'loading-pulse');
                btnText.textContent = "重新嘗試";
                btnIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />`; // Warning icon
                
                statusMessage.textContent = message;
                statusMessage.classList.add('bg-red-100', 'text-red-700');
                statusMessage.classList.remove('hidden');
            }
        }

        // 4. 表單提交事件處理
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const teamCode = teamCodeInput.value.trim();
            const name = nameInput.value.trim();

            if (!teamCode) {
                setUIState('error', "請輸入團隊編號！");
                return;
            }

            try {
                // 狀態：定位中
                setUIState('loading', '正在獲取 GPS 定位...');
                
                // 取得位置
                const position = await getGeolocation();
                // 經緯度精準至小數點後 6 位
                const latitude = parseFloat(position.coords.latitude.toFixed(6));
                const longitude = parseFloat(position.coords.longitude.toFixed(6));
                
                // 狀態：傳送中
                setUIState('loading', '資料傳送中...');
                
                // 準備 Payload
                const payload = {
                    teamCode: teamCode,
                    uuid: deviceUUID,
                    name: name,
                    latitude: latitude,
                    longitude: longitude,
                    timestamp: getTaipeiTime()
                };

                // 傳送 API
                // 注意：使用 mode: 'no-cors' 會產生不透明回應 (Opaque Response)，
                // Javascript 無法讀取 response body 或 status code，
                // 因此只要 fetch 成功發出且沒拋出 Network Error，我們就當作傳送完成。
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                // 狀態：成功
                setUIState('success', `回報成功！您的位置: ${latitude}, ${longitude}`);
                
            } catch (error) {
                console.error('Error:', error);
                setUIState('error', error.message || '發生未知錯誤，請檢查網路連線後重試。');
            }
        });
    </script>
</body>
</html>
